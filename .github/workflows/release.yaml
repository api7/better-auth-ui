name: Release

on:
  push:
    tags:
      - "v*.*.*-api7.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        required: false
        default: true
        type: boolean
      auth_mode:
        description: "Use Trusted Publishing for existing packages, or npm-token for first publish"
        required: true
        default: trusted-publishing
        type: choice
        options:
          - trusted-publishing
          - npm-token

env:
  NODE_VERSION: "24.15.0"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup release flow
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            package_version="$(node -p "require('./package.json').version")"
            echo "RELEASE_VERSION=$package_version" >> "$GITHUB_ENV"
          fi

      - name: Verify release source
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              exit 0
            fi
            echo "Release tag must point to a commit contained in origin/main"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual release must run from the main branch"
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "Manual release must run from the current origin/main HEAD"
            exit 1
          fi

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Tag version v$RELEASE_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
            exit 1
          fi

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish to npm with Trusted Publishing
        if: github.event_name == 'push' || inputs.auth_mode == 'trusted-publishing'
        run: |
          args=(--access public)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}"

      - name: Publish to npm with token
        if: github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'npm-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is required for npm-token publishing"
            exit 1
          fi
          args=(--access public)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}"
