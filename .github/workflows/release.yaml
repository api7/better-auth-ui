name: Release

on:
  push:
    tags:
      - "v*.*.*-api7.*"

env:
  NODE_VERSION: "24.15.0"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup release flow
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/v}" >> "$GITHUB_ENV"

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit contained in origin/main"
            exit 1
          fi

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Tag version v$RELEASE_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
            exit 1
          fi

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
